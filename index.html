/* ============================================================
   ГЕНЕРАЦИЯ МИРА — почти весь мир суша, чтобы было ГДЕ ХОДИТЬ
   ============================================================ */
let worldMap = [];   // 2D-массив тайлов
let objects = [];    // деревья, дома
let decor = [];      // цветы, кусты, фонари

function hash2(x, y) {
  let n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return n - Math.floor(n);
}
function smoothStep(t) { return t * t * (3 - 2 * t); }
function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = hash2(xi, yi),     b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  const u = smoothStep(xf), v = smoothStep(yf);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y) {
  let v = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 4; i++) { v += valueNoise(x * f, y * f) * amp; amp *= 0.5; f *= 2; }
  return v;
}

function inBounds(x, y) { return x >= 0 && y >= 0 && x < MAP_W && y < MAP_H; }
function objAt(x, y) { return objects.find(o => o.x === x && o.y === y); }
function isSolid(x, y) {
  if (!inBounds(x, y)) return true;
  const o = objAt(x, y);
  if (o && o.type !== 'sign') return true;
  const t = worldMap[y][x];
  return t === 0 || t === 1 || t === 2;   // море/глубина/озеро непроходимы
}

function generateMap() {
  worldMap = []; objects = []; decor = [];
  // 1) Базовый террейн: почти всё — суша, noise создаёт холмы и редкие озёра
  for (let y = 0; y < MAP_H; y++) {
    worldMap[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      const dx = (x - MAP_W / 2) / (MAP_W / 2);
      const dy = (y - MAP_H / 2) / (MAP_H / 2);
      const dist = Math.sqrt(dx * dx + dy * dy);
      // лёгкий крен к краям: края — пляжи, центр — леса. void почти не бывает
      const n = fbm(x * 0.09, y * 0.09) * 0.55 + 0.45;
      const land = n - dist * 0.16;

      let t;
      if (land > 0.52)      t = 4;   // трава
      else if (land > 0.42) t = 3;   // пляж
      else if (land > 0.30) t = 2;   // редкие мелкие озёра
      else if (land > 0.24) t = 1;
      else                  t = 0;   // почти нигде
      worldMap[y][x] = t;
    }
  }

  // 2) Красивое озеро в центро-западе (непреодолимое, но обходимое)
  carveBlob(28, 20, 6.5, 2);
  // Лесные массивы на траве
  scatterForest(0.10, 0.34, 6);
  scatterForest(0.42, 0.55, 6);

  // 3) Деревня в центре
  const cx = 50, cy = 32;
  for (let y = cy - 6; y <= cy + 6; y++)
    for (let x = cx - 9; x <= cx + 9; x++)
      if (inBounds(x, y) && worldMap[y][x] >= 3) worldMap[y][x] = 4;

  // дороги: главная — горизонталь, вертикаль, тропы наружу
  for (let x = cx - 9; x <= cx + 9; x++) if (inBounds(x, cy)) worldMap[cy][x] = 8;
  for (let y = cy - 6; y <= cy + 6; y++) if (inBounds(cx, y)) worldMap[y][cx] = 8;
  for (let x = cx + 9; x < cx + 26; x++) if (inBounds(x, cy) && worldMap[cy][x] >= 3) worldMap[cy][x] = 8;
  for (let x = cx - 26; x < cx - 9; x++) if (inBounds(x, cy) && worldMap[cy][x] >= 3) worldMap[cy][x] = 8;
  for (let y = cy + 6; y < cy + 20; y++) if (inBounds(cx, y) && worldMap[cx][y] >= 3) worldMap[cx][y] = 8;
  for (let y = cy - 20; y < cy - 6; y++) if (inBounds(cx, y) && worldMap[cx][y] >= 3) worldMap[cx][y] = 8;

  // 4) Дома (8 штук — настоящая деревня)
  const hL = [[-6,-4],[ 5,-4],[-6, 4],[ 5, 4],[-1,-4],[ 2,-4],[-1, 4],[ 2, 4]];
  for (const [ox, oy] of hL) placeHouse(cx + ox, cy + oy);

  // 5) Декор: цветы и кусты
  for (let i = 0; i < 900; i++) {
    const x = Math.floor(Math.random() * MAP_W), y = Math.floor(Math.random() * MAP_H);
    if (worldMap[y][x] === 4 && !objAt(x, y)) decor.push({ x, y, type: Math.random() < 0.75 ? 'flower' : 'bush' });
  }
  // поле пшеницы возле деревни
  for (let y = cy + 8; y < cy + 12; y++)
    for (let x = cx + 12; x < cx + 22; x++)
      if (inBounds(x, y) && worldMap[y][x] === 4) worldMap[y][x] = 10;
}

function carveBlob(cx, cy, r, t) {
  for (let y = Math.floor(cy - r - 2); y <= cy + r + 2; y++)
    for (let x = Math.floor(cx - r - 2); x <= cx + r + 2; x++) {
      if (!inBounds(x, y)) continue;
      const d = Math.hypot(x - cx, y - cy);
      if (d < r * (0.78 + hash2(x, y) * 0.44)) worldMap[y][x] = t;
    }
  // песчаные берега вокруг озера
  for (let y = Math.floor(cy - r - 3); y <= cy + r + 3; y++)
    for (let x = Math.floor(cx - r - 3); x <= cx + r + 3; x++) {
      if (!inBounds(x, y)) continue;
      if (worldMap[y][x] === 4 || worldMap[y][x] === 5) {
        outer:
        for (const [ox, oy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          if (inBounds(x + ox, y + oy) && worldMap[y + oy][x + ox] === 2) { worldMap[y][x] = 3; break outer; }
        }
      }
    }
}

function scatterForest(lo, hi, type) {
  for (let y = 0; y < MAP_H; y++)
    for (let x = 0; x < MAP_W; x++) {
      if (worldMap[y][x] !== 4) continue;
      const n = fbm(x * 0.16, y * 0.16);
      if (n > lo && n < hi && Math.random() < 0.62) {
        objects.push({ x, y, type: 'tree' });
      }
    }
}

function placeHouse(x, y) {
  for (let dy = -1; dy <= 1; dy++)
    for (let dx = -1; dx <= 1; dx++)
      if (inBounds(x + dx, y + dy)) worldMap[y + dy][x + dx] = 9;
  objects.push({ x, y, type: 'house' });
  decor.push({ x: x + 2, y: y + 2, type: 'lamp' });
}

      goal: 4, progress: 0, done: false, rewardXp: 20, rewardGold: 10 },
    { id: 'q_explore', title: 'Разведка края', desc: 'Дойди до берега моря на севере острова.',
      goal: 1, progress: 0, done: false, rewardXp: 25, rewardGold: 12 }
  ];
}

function initSkills() {
  skills = [
    { id: 's_slash', name: 'Размашистый удар', desc: 'Атака бьёт по всем врагам рядом.', cost: 1, learned: false, req: [] },
    { id: 's_tough', name: 'Крепкая кожа',     desc: '+10 к максимуму здоровья.',        cost: 1, learned: false, req: [] },
    { id: 's_heal',  name: 'Лечение',          desc: 'A — лечиться за зелье (10 HP).',   cost: 1, learned: false, req: [] },
    { id: 's_crit',  name: 'Смертельный удар', desc: '25% шанс двойного урона.',         cost: 1, learned: false, req: ['s_slash'] }
  ];
}

function hasSkill(id) { const s = skills.find(s => s.id === id); return !!(s && s.learned); }
function canLearn(s) { return !s.learned && skillPoints >= s.cost && s.req.every(r => hasSkill(r)); }
function learn(s) {
  if (!canLearn(s)) return;
  skillPoints -= s.cost; s.learned = true;
  if (s.id === 's_tough') { player.hpMax += 10; player.hp += 10; }
  toast('Изучено: ' + s.name, '#8ee08e');
}
function toast(text, color) { ui.toast.push({ text, color: color || '#fff', t: 0, life: 3.2 }); }

/* ============================================================
   ВВОД
   ============================================================ */
const keys = {};
function keyPressed() {
  const k = (key || '').toLowerCase();
  keys[k] = true;
  if (k === 'e') { if (ui.dialog) ui.dialog = null; else interact(); }
  if (k === 'q') { if (ui.dialog) ui.dialog = null; else ui.showQuests = !ui.showQuests; }
  if (k === 'k') ui.showSkills = !ui.showSkills;
  if (k === 'escape') { ui.dialog = null; ui.showQuests = false; ui.showSkills = false; }
  if (k === '1' && ui.showSkills) learn(skills[0]);
  if (k === '2' && ui.showSkills) learn(skills[1]);
  if (k === '3' && ui.showSkills) learn(skills[2]);
  if (k === '4' && ui.showSkills) learn(skills[3]);
  if (k === 'a' && hasSkill('s_heal') && player.hp < player.hpMax && player.potions > 0) {
    player.potions--; player.hp = Math.min(player.hpMax, player.hp + 10);
    toast('Лечение +10 HP', '#8ee08e');
  }
  if (k === ' ') attack();
  return false;
}
function keyReleased() { keys[(key || '').toLowerCase()] = false; return false; }
function mousePressed() { if (!ui.dialog) attack(); return false; }

function inputVector() {
  let dx = 0, dy = 0;
  if (keys['a'] || keyIsDown(LEFT_ARROW))  dx -= 1;
  if (keys['d'] || keyIsDown(RIGHT_ARROW)) dx += 1;
  if (keys['w'] || keyIsDown(UP_ARROW))    dy -= 1;
  if (keys['s'] || keyIsDown(DOWN_ARROW))  dy += 1;
  return { dx, dy };
}

/* ============================================================
   ОБНОВЛЕНИЕ
   ============================================================ */
function updatePlayer(dt) {
  const { dx, dy } = inputVector();
  player.moving = (dx !== 0 || dy !== 0) && player.atkT <= 0;

  if (player.moving) {
    const len = Math.hypot(dx, dy) || 1;
    const nx = dx / len, ny = dy / len;
    tryMove(player, nx * player.speed * dt, ny * player.speed * dt);
    if (Math.abs(nx) > Math.abs(ny)) player.dir = nx > 0 ? 'right' : 'left';
    else if (ny !== 0) player.dir = ny > 0 ? 'down' : 'up';
    player.animT += dt;
    if (player.animT > 0.14) { player.animT = 0; player.frame = 1 - player.frame; }
  } else {
    player.frame = 0;
    player.animT = 0;
  }
  player.atkT = Math.max(0, player.atkT - dt);
  player.atkAnim = Math.max(0, player.atkAnim - dt);
  player.hurtT = Math.max(0, player.hurtT - dt);
}

function tryMove(ent, mx, my) {
  const r = 0.32;
  const nx = ent.x + mx, ny = ent.y + my;
  const blocked = (x, y) => isSolid(Math.floor(x - r), Math.floor(y - r)) ||
                            isSolid(Math.floor(x + r), Math.floor(y - r)) ||
                            isSolid(Math.floor(x - r), Math.floor(y + r)) ||
                            isSolid(Math.floor(x + r), Math.floor(y + r));
  if (!blocked(nx, ent.y)) ent.x = nx;
  if (!blocked(ent.x, ny)) ent.y = ny;
}

function updateMobs(dt) {
  for (const m of mobs) {
    if (!m.alive) continue;
    m.hurtT = Math.max(0, m.hurtT - dt);
    m.attackCd = Math.max(0, m.attackCd - dt);
    m.atkT = Math.max(0, m.atkT - dt);

    const distP = Math.hypot(player.x - m.x, player.y - m.y);

    if (distP < 8 && player.hp > 0) {
      // агро: бежит к игроку
      const ux = (player.x - m.x) / (distP || 1), uy = (player.y - m.y) / (distP || 1);
      if (distP > 1.0) {
        tryMove(m, ux * m.speed * dt, uy * m.speed * dt);
        m.moving = true;
        if (Math.abs(ux) > Math.abs(uy)) m.dir = ux > 0 ? 'right' : 'left';
        else m.dir = uy > 0 ? 'down' : 'up';
      } else if (m.attackCd <= 0) {
        // НАПАДЕНИЕ: рывок к игроку + урон
        m.atkT = 0.35;
        m.attackCd = 1.15;
        tryMove(m, ux * 0.5, uy * 0.5); // подшаг
        const dmg = Math.max(1, m.atk + Math.floor(Math.random() * 3) - 1);
        if (Math.hypot(player.x - m.x, player.y - m.y) < 1.3) {
          player.hp -= dmg;
          player.hurtT = 0.25;
          addFloater(player.x, player.y - 0.8, '-' + dmg, '#ff7070');
          for (let i = 0; i < 8; i++) particles.push(makeParticle(player.x, player.y, '#ff6b6b'));
          if (player.hp <= 0) respawnPlayer();
        }
      }
    } else {
      // блуждание
      m.timer -= dt;
      if (m.timer <= 0) {
        m.timer = 2 + Math.random() * 3;
        const a = Math.random() * Math.PI * 2;
        m.wander.x = m.x + Math.cos(a) * 3.5;
        m.wander.y = m.y + Math.sin(a) * 3.5;
      }
      const len = Math.hypot(m.wander.x - m.x, m.wander.y - m.y);
      if (len > 0.3) {
        const ux = (m.wander.x - m.x) / len, uy = (m.wander.y - m.y) / len;
        tryMove(m, ux * m.speed * 0.45 * dt, uy * m.speed * 0.45 * dt);
        m.moving = true;
        if (Math.abs(ux) > Math.abs(uy)) m.dir = ux > 0 ? 'right' : 'left';
        else m.dir = uy > 0 ? 'down' : 'up';
      } else { m.moving = false; }
    }
    m.animT += dt;
    if (m.animT > 0.18) { m.animT = 0; m.frame = 1 - m.frame; }
  }

  // расталкивание мобов
  for (let i = 0; i < mobs.length; i++)
    for (let j = i + 1; j < mobs.length; j++) {
      const a = mobs[i], b = mobs[j];
      if (!a.alive || !b.alive) continue;
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 0.7 && d > 0) {
        const push = (0.7 - d) / 2;
        const ux = (a.x - b.x) / d, uy = (a.y - b.y) / d;
        tryMove(a, ux * push, uy * push);
        tryMove(b, -ux * push, -uy * push);
      }
    }
}

function respawnPlayer() {
  player.hp = player.hpMax;
  player.x = 50.5; player.y = 32.5;
  toast('Ты потерял сознание... и очнулся в деревне.', '#ffb0b0');
}

function faceDir() {
  const d = player.dir;
  if (d === 'up') return [0, -1];
  if (d === 'down') return [0, 1];
  if (d === 'left') return [-1, 0];
  return [1, 0];
}

function attack() {
  if (player.atkT > 0) return;
  player.atkT = 0.25; player.atkAnim = 0.28;
  const [fx, fy] = faceDir();

  let hits = 0;
  const sweep = hasSkill('s_slash');
  for (const m of mobs) {
    if (!m.alive) continue;
    const dist = Math.hypot(m.x - player.x, m.y - player.y);
    if (dist > 1.55) continue;
    // фронт по направлению взгляда (или все вокруг при sweep)
    const dot = ((m.x - player.x) * fx + (m.y - player.y) * fy) / (dist || 1);
    if (!sweep && dot < 0.35) continue;
    let dmg = 5 + Math.floor(Math.random() * 3) + Math.floor(player.level * 1.5);
    if (hasSkill('s_crit') && Math.random() < 0.25) dmg = Math.round(dmg * 2);
    m.hp -= dmg;
    m.hurtT = 0.3;
    hits++;
    addFloater(m.x, m.y - 0.8, '-' + dmg, dmg > 8 ? '#ffd166' : '#ffe066');
    // отбрасывание назад
    const kb = 0.35;
    tryMove(m, -fx * kb, -fy * kb);
    for (let i = 0; i < 10; i++) particles.push(makeParticle(m.x, m.y, '#ffd166'));
    if (m.hp <= 0) killMob(m);
  }
  if (hits === 0) {
    for (let i = 0; i < 6; i++)
      particles.push(makeParticle(player.x + fx * 0.9, player.y + fy * 0.9, '#cfd6ff'));
  }
}

function killMob(m) {
  m.alive = false;
  player.xp += m.xp;
  player.gold += 2 + Math.floor(Math.random() * 4);
  toast('Побеждён: ' + m.name + ' (+' + m.xp + ' XP)', '#ffe066');
  drops.push({ x: m.x, y: m.y, t: 0, type: Math.random() < 0.5 ? 'gold' : 'potion' });
  corpses.push({ x: m.x, y: m.y, kind: m.kind, t: 0 });
  for (let i = 0; i < 16; i++) particles.push(makeParticle(m.x, m.y, '#88ff88'));
  checkLevel();
  bumpQuest('q_goblins', 1);
  // респавн где-то в мире
  setTimeout(() => {
    for (let t = 0; t < 14; t++) {
      const x = 6 + Math.floor(Math.random() * (MAP_W - 12));
      const y = 6 + Math.floor(Math.random() * (MAP_H - 12));
      if (!isSolid(x, y) && Math.hypot(x - player.x, y - player.y) > 12) {
        mobs.push(makeMob(x, y, Math.random() < 0.3 ? 'brute' : 'goblin'));
        break;
      }
    }
  }, 18000);
}

function checkLevel() {
  while (player.xp >= player.xpNext) {
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.floor(player.xpNext * 1.6);
    player.hpMax += 6; player.hp = player.hpMax;
    player.mpMax += 2; player.mp = player.mpMax;
    skillPoints++;
    toast('Уровень ' + player.level + '! +1 очко навыка (K)', '#9ad7ff');
  }
}

function bumpQuest(id, amount) {
  const q = quests.find(q => q.id === id);
  if (!q || q.done) return;
  q.progress = Math.min(q.goal, q.progress + amount);
  if (q.progress >= q.goal) {
    q.done = true;
    player.xp += q.rewardXp; player.gold += q.rewardGold;
    toast('Квест выполнен: ' + q.title + ' (+' + q.rewardXp + ' XP)', '#b6e3a0');
    checkLevel();
  }
}

function interact() {
  if (ui.dialog) { ui.dialog = null; return; }
  for (const n of npcs) {
    if (Math.hypot(n.x - player.x, n.y - player.y) < 1.7) {
      ui.dialog = { name: n.name, line: n.lines[Math.floor(Math.random() * n.lines.length)] };
      if (n.gift && !n.gave) { n.gave = true; player.potions += 2; toast('Кузнец дал 2 зелья', '#ffe066'); }
      if (!n.met) {
        n.met = true;
        bumpQuest('q_npcs', 1);
      }
      return;
    }
  }
  for (const m of mobs) {
    if (m.alive && Math.hypot(m.x - player.x, m.y - player.y) < 1.5) { attack(); return; }
  }
  toast('Рядом никого нет.', '#c8c8d0');
}

/* ============================================================
   ЭФФЕКТЫ
   ============================================================ */
function makeParticle(x, y, color) {
  const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 4;
  return { x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.35, t: 0, color };
}
function addFloater(x, y, text, color) { floaters.push({ x, y, text, color, t: 0, life: 1.0 }); }

function updateEffects(dt) {
  for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; }
  particles = particles.filter(p => p.t < p.life);
  for (const f of floaters) { f.t += dt; f.y -= dt * 0.8; }
  floaters = floaters.filter(f => f.t < f.life);
  for (const c of corpses) c.t += dt;
  corpses = corpses.filter(c => c.t < 1.6);
  for (const d of drops) d.t += dt;
  for (const d of drops) {
    if (d.t > 0.4 && !d.taken && Math.hypot(d.x - player.x, d.y - player.y) < 1.0) {
      d.taken = true;
      if (d.type === 'gold') { const g = 3 + Math.floor(Math.random() * 6); player.gold += g; addFloater(d.x, d.y, '+' + g + ' золота', '#ffd166'); }
      else { player.potions = Math.min(9, player.potions + 1); addFloater(d.x, d.y, '+1 зелье', '#9ad7ff'); }
    }
  }
  drops = drops.filter(d => !d.taken && d.t < 30);
  for (const t of ui.toast) t.t += dt;
  ui.toast = ui.toast.filter(t => t.t < t.life);
}

/* ============================================================
   ОТРИСОВКА
   ============================================================ */
let cam = { x: 0, y: 0 };
let viewW = 0, viewH = 0;

function setup() {
  viewW = VIEW_W * TILE * ZOOM;
  viewH = VIEW_H * TILE * ZOOM;
  const c = createCanvas(viewW, viewH);
  c.parent(document.body);
  pixelDensity(1);
  noSmooth();
  textFont('monospace');
  generateMap();
  spawnNPCs();
  spawnMobs();
  initQuests();
  initSkills();
  toast('Большой мир готов! WASD — идти, ПРОБЕЛ — атака, E — говорить', '#dbe9ff');
}

function draw() {
  const dt = Math.min(0.05, deltaTime / 1000);

  updatePlayer(dt);
  updateMobs(dt);
  updateEffects(dt);
  updateQuests(dt);

  cam.x = player.x - VIEW_W / 2;
  cam.y = player.y - VIEW_H / 2;
  cam.x = Math.max(0, Math.min(MAP_W - VIEW_W, cam.x));
  cam.y = Math.max(0, Math.min(MAP_H - VIEW_H, cam.y));

  background(COLORS.void);
  push();
  scale(ZOOM);
  translate(-cam.x * TILE, -cam.y * TILE);

  drawTiles();
  drawDecor();
  drawCorpses();
  drawEntities();
  pop();

  drawOverlayUI();
}

function tileColor(t, x, y) {
  switch (t) {
    case 0: return COLORS.void;
    case 1: return COLORS.deep;
    case 2: {
      const w = Math.sin((x * 0.7 + y * 1.3 + frameCount * 0.03)) * 8;
      return [COLORS.water[0] + w, COLORS.water[1] + w, COLORS.water[2] + w];
    }
    case 3: return COLORS.sand;
    case 4: return ((x + y) % 2 === 0) ? COLORS.grass : COLORS.grass2;
    case 5: return COLORS.grass2;
    case 6: return COLORS.forest;
    case 7: return ((x + y) % 2 === 0) ? COLORS.stone : COLORS.stone2;
    case 8: return COLORS.path;
    case 9: return ((x + y) % 2 === 0) ? COLORS.floor : COLORS.floor2;
    case 10: return COLORS.crops;
    case 11: return COLORS.flowers;
    default: return COLORS.grass;
  }
}

function drawTiles() {
  const sx = Math.floor(cam.x), sy = Math.floor(cam.y);
  noStroke();
  for (let y = sy - 1; y < sy + VIEW_H + 2; y++) {
    for (let x = sx - 1; x < sx + VIEW_W + 2; x++) {
      if (!inBounds(x, y)) { fill(COLORS.void); rect(x * TILE, y * TILE, TILE, TILE); continue; }
      const c = tileColor(worldMap[y][x], x, y);
      fill(c[0], c[1], c[2]);
      rect(x * TILE, y * TILE, TILE, TILE);

      const h = hash2(x, y);
      if (worldMap[y][x] === 4 || worldMap[y][x] === 5) {
        if (h > 0.62) { fill(58, 118, 54); rect(x * TILE + Math.floor(h * 13), y * TILE + Math.floor(h * 9), 2, 2); }
        if (h > 0.88) { fill(120, 170, 100); rect(x * TILE + Math.floor(h * 6), y * TILE + Math.floor(h * 12), 1, 3); }
      }
      if (worldMap[y][x] === 3 && h > 0.85) { fill(190, 170, 120); rect(x * TILE + Math.floor(h * 10), y * TILE + Math.floor(h * 8), 3, 2); }
      if (worldMap[y][x] === 2 && h > 0.8) { fill(140, 190, 235); rect(x * TILE + 3, y * TILE + 5, 4, 2); }
      if (worldMap[y][x] === 10 && h > 0.5) { fill(196, 200, 110); rect(x * TILE + Math.floor(h * 12), y * TILE + 6, 2, 4); }
    }
  }
}

function drawDecor() {
  for (const d of decor) {
    if (d.x < cam.x - 2 || d.x > cam.x + VIEW_W + 2 || d.y < cam.y - 2 || d.y > cam.y + VIEW_H + 2) continue;
    const px = d.x * TILE, py = d.y * TILE;
    if (d.type === 'flower') {
      fill(232, 190, 130); rect(px + 7, py + 6, 2, 3);
      fill(140, 170, 100); rect(px + 6, py + 9, 4, 2);
    } else if (d.type === 'bush') {
      fill(46, 104, 50); rect(px + 3, py + 8, 10, 6);
      fill(150, 180, 90); rect(px + 5, py + 7, 6, 3);
    } else if (d.type === 'lamp') {
      const on = Math.sin(frameCount * 0.05 + d.x) > 0.7;
      fill(60, 40, 26); rect(px, py + 6, 2, 8);
      fill(on ? 255 : 150, on ? 220 : 140, on ? 90 : 60); rect(px - 1, py + 3, 4, 4);
    }
  }
}

function drawCorpses() {
  for (const c of corpses) {
    const a = 1 - c.t / 1.6;
    const px = c.x * TILE - SPRITE / 2;
    const py = c.y * TILE - SPRITE + 6;
    push();
    translate(px, py);
    const spr = c.kind === 'brute' ? SPR_G_BRUTE_1 : SPR_G_1;
    for (let y = 0; y < spr.length; y++)
      for (let xx = 0; xx < spr[y].length; xx++) {
        const col = PAL[spr[y][xx]];
        if (!col) continue;
        fill(col[0] * a, col[1] * a * 0.8, col[2] * a * 0.8);
        rect(xx, y, 1, 1);
      }
    pop();
  }
}

function drawEntities() {
  const list = [];
  for (const o of objects) {
    if (o.x < cam.x - 3 || o.x > cam.x + VIEW_W + 3 || o.y < cam.y - 3 || o.y > cam.y + VIEW_H + 4) continue;
    list.push({ y: o.y, draw: () => drawObject(o) });
  }
  for (const d of drops) list.push({ y: d.y, draw: () => drawDrop(d) });
  for (const n of npcs) {
    n.animT = (n.animT || 0) + 0.008;
    if (n.animT > 0.3) n.animT = 0;
    list.push({ y: n.y, draw: () => drawNPC(n) });
  }
  for (const m of mobs) if (m.alive) list.push({ y: m.y, draw: () => drawMob(m) });
  list.push({ y: player.y, draw: () => drawPlayerSprite() });
  for (const p of particles) list.push({ y: p.y - 0.05, draw: () => drawParticle(p) });
  for (const f of floaters) list.push({ y: f.y - 0.1, draw: () => drawFloater(f) });

  list.sort((a, b) => a.y - b.y);
  for (const item of list) item.draw();
}

function drawObject(o) {
  const px = o.x * TILE, py = o.y * TILE;
  if (o.type === 'tree') {
    const sway = Math.sin(frameCount * 0.02 + o.x) * 1;
    fill(COLORS.wood2); rect(px + 6, py + 8, 4, 8);
    fill(COLORS.wood);  rect(px + 6, py + 8, 2, 8);
    push();
    translate(px, py);
    translate(sway, 0);
    fill(30, 78, 44);   rect(1, -6, 14, 14);
    fill(44, 104, 54);  rect(2, -5, 12, 10);
    fill(64, 130, 62);  rect(4, -3, 8, 5);
    fill(88, 158, 78);  rect(5, -2, 4, 2);
    pop();
  } else if (o.type === 'house') {
    fill(COLORS.wood);  rect(px - 8, py - 8, 32, 32);
    fill(COLORS.wood2); rect(px - 8, py + 18, 32, 6);
    fill(COLORS.roof2); rect(px - 12, py - 14, 40, 10);
    fill(COLORS.roof);  rect(px - 14, py - 20, 44, 8);
    fill(COLORS.roof2); rect(px - 10, py - 24, 36, 6);
    // окно светится
    const glow = 140 + Math.sin(frameCount * 0.06 + o.x) * 30;
    fill(glow + 40, glow + 60, 90);
    rect(px - 2, py - 2, 8, 8);
    fill(50, 90, 130);   rect(px + 1, py - 1, 2, 6);
    fill(COLORS.door);   rect(px + 12, py + 2, 8, 14);
    fill(200, 170, 90);  rect(px + 18, py + 8, 2, 2);
    fill(90, 90, 96);    rect(px + 14, py - 28, 6, 6);
    // дым из трубы
    const sm = (frameCount * 0.04 + o.x) % 1;
    fill(200, 200, 205, 120 * (1 - sm));
    rect(px + 15, py - 34 - sm * 8, 3, 3);
  }
}

function drawDrop(d) {
  const px = d.x * TILE, py = d.y * TILE + Math.sin(frameCount * 0.1) * 2;
  if (d.type === 'gold') {
    fill(120, 90, 20); rect(px + 4, py + 6, 8, 8);
    fill(240, 200, 80); rect(px + 5, py + 7, 6, 6);
    fill(255, 235, 150); rect(px + 6, py + 8, 2, 2);
  } else {
    fill(40, 70, 130); rect(px + 4, py + 4, 8, 10);
    fill(120, 190, 240); rect(px + 5, py + 5, 6, 8);
    fill(230, 245, 255); rect(px + 6, py + 6, 2, 4);
  }
}

/* --- спрайт по матрице, flip, tint, fade --- */
function drawSprite(sprite, px, py, flip, tint) {
  push();
  translate(px, py);
  if (flip) { translate(SPRITE, 0); scale(-1, 1); }
  noStroke();
  for (let y = 0; y < sprite.length; y++) {
    const row = sprite[y];
    for (let x = 0; x < row.length; x++) {
      const col = PAL[row[x]];
      if (!col) continue;
      if (tint) fill(col[0] * tint[0], col[1] * tint[1], col[2] * tint[2]);
      else fill(col[0], col[1], col[2]);
      rect(x, y, 1, 1);
    }
  }
  pop();
}

/* --- выбор кадра по направлению --- */
function animFrame(dir, frame) {
  if (dir === 'up')   return [frame ? SPR_P_UP_2   : SPR_P_UP_1,   false];
  if (dir === 'left') return [frame ? SPR_P_SIDE_2 : SPR_P_SIDE_1, true];
  if (dir === 'right')return [frame ? SPR_P_SIDE_2 : SPR_P_SIDE_1, false];
  return [frame ? SPR_P_DOWN_2 : SPR_P_DOWN_1, false];
}
function mobFrame(dir, frame, kind) {
  const g1 = kind === 'brute' ? SPR_G_BRUTE_1 : SPR_G_1;
  const g2 = kind === 'brute' ? SPR_G_BRUTE_2 : SPR_G_2;
  const spr = frame ? g2 : g1;
  return [spr, dir === 'left'];
}

function drawPlayerSprite() {
  const px = player.x * TILE - SPRITE / 2;
  const py = player.y * TILE - SPRITE + 3;
  const [spr, flip] = animFrame(player.dir, player.moving ? player.frame : 0);

  noStroke(); fill(0, 0, 0, 70);
  ellipse(player.x * TILE, player.y * TILE + 4, 12, 5);

  const bob = player.moving ? (player.frame ? -1 : 0) : 0;
  const tint = player.hurtT > 0 ? [3, 0.9, 0.9] : null;
  drawSprite(spr, px, py + bob, flip, tint);

  // АНИМАЦИЯ АТАКИ: клинок с дугой
  if (player.atkAnim > 0) {
    const t = 1 - player.atkAnim / 0.28;
    const [fx, fy] = faceDir();
    const ang = Math.atan2(fy, fx);
    const a0 = ang - 1.2 + t * 1.7;
    push();
    translate(player.x * TILE, player.y * TILE - 8);
    rotate(a0);
    fill(PAL.p[0], PAL.p[1], PAL.p[2]);
    rect(6, -1, 9, 2);
    fill(PAL.q[0], PAL.q[1], PAL.q[2]);
    rect(13, -1, 3, 2);
    noFill();
    stroke(255, 255, 200, 150 * t);
    strokeWeight(2);
    arc(0, 0, 18, 18, -0.4, t * 1.6 - 0.4);
    noStroke();
    pop();
  }
  drawHpBar(player.x, player.y - 0.75, player.hp, player.hpMax, 14, true);
}

function drawNPC(n) {
  const px = n.x * TILE - SPRITE / 2;
  const py = n.y * TILE - SPRITE + 3;
  noStroke(); fill(0, 0, 0, 60);
  ellipse(n.x * TILE, n.y * TILE + 4, 12, 5);
  const spr = n.kind === 'mage'
    ? (n.animT > 0.15 ? SPR_MAGE_2 : SPR_MAGE_1)
    : (n.animT > 0.15 ? SPR_NPC_2 : SPR_NPC_1);
  const bobIdle = Math.sin(frameCount * 0.06 + n.x) * 1;
  drawSprite(spr, px, py + bobIdle, n.dir === 'left', null);

  if (Math.hypot(n.x - player.x, n.y - player.y) < 1.9) {
    const bob = Math.sin(frameCount * 0.12) * 1.5;
    fill(255, 240, 150); rect(n.x * TILE - 1, py - 7 + bob, 3, 5);
    fill(255, 240, 150); rect(n.x * TILE - 2, py - 1 + bob, 5, 2);
  }
  fill(240, 240, 245, 200);
  textSize(6); textAlign(CENTER, BOTTOM);
  text(n.name, n.x * TILE, py - 2);
}

function drawMob(m) {
  const px = m.x * TILE - SPRITE / 2;
  const py = m.y * TILE - SPRITE + 3;
  const [spr, flip] = mobFrame(m.dir, m.moving ? m.frame : 0, m.kind);

  noStroke(); fill(0, 0, 0, 60);
  ellipse(m.x * TILE, m.y * TILE + 4, 12, 5);

  const tint = m.hurtT > 0 ? (m.hurtT > 0.15 ? [3, 0.9, 0.9] : [1.4, 1.4, 1.4]) : null;
  const bob = (m.moving && m.frame) ? -1 : 0;
  const lunge = m.atkT > 0 ? 2 : 0; // рывок вперёд при атаке
  const lx = lunge * (m.dir === 'left' ? -1 : m.dir === 'right' ? 1 : 0);
  const ly = lunge * (m.dir === 'up' ? -1 : m.dir === 'down' ? 1 : 0);
  drawSprite(spr, px + lx, py + ly + bob, flip, tint);

  // красный «!» при агро
  if (Math.hypot(m.x - player.x, m.y - player.y) < 6.5 && m.attackCd > 0.7) {
    fill(255, 90, 60);
    rect(m.x * TILE + 2, py - 8, 2, 4);
    rect(m.x * TILE + 2, py - 3, 2, 2);
  }
  if (m.hp < m.hpMax) drawHpBar(m.x, m.y - 0.75, m.hp, m.hpMax, 14, false);
}

/* --- полоса здоровья --- */
function drawHpBar(x, y, hp, hpMax, wpx, hideFull) {
  const ratio = Math.max(0, hp / hpMax);
  if (hideFull && ratio >= 1) return;
  const px = x * TILE - wpx / 2, py = y * TILE;
  noStroke();
  fill(20, 20, 26);   rect(px - 1, py - 1, wpx + 2, 4);
  fill(120, 30, 30);  rect(px, py, wpx, 2);
  fill(ratio > 0.5 ? 90 : 220, ratio > 0.5 ? 210 : 80, 80);
  rect(px, py, wpx * ratio, 2);
}

function drawParticle(p) {
  const a = 1 - p.t / p.life;
  const c = color(p.color);
  noStroke();
  fill(red(c), green(c), blue(c), 255 * a);
  const px = p.x * TILE, py = p.y * TILE;
  rect(px, py, 2, 2);
}

function drawFloater(f) {
  const a = 1 - f.t / f.life;
  push();
  textAlign(CENTER, BOTTOM);
  textSize(7);
  noStroke();
  fill(0, 0, 0, 180 * a);
  text(f.text, f.x * TILE + 1, f.y * TILE + 1);
  const c = color(f.color);
  fill(red(c), green(c), blue(c), 255 * a);
  text(f.text, f.x * TILE, f.y * TILE);
  pop();
}

/* ---------- HUD ---------- */
function drawOverlayUI() {
  push();
  const hudW = 176, hudH = 68;
  fill(10, 12, 20, 210); noStroke();
  rect(10, 10, hudW, hudH, 6);
  stroke(90, 110, 150); strokeWeight(1); noFill();
  rect(10, 10, hudW, hudH, 6);
  noStroke();

  fill(255); textSize(12); textAlign(LEFT, TOP);
  text('Пиксельное приключение', 20, 18);
  fill(180, 200, 230); textSize(11);
  text('Ур. ' + player.level + '   XP ' + player.xp + '/' + player.xpNext, 20, 34);

  fill(30, 30, 38); rect(20, 50, 156, 7);
  fill(190, 60, 60); rect(20, 50, 156, 7);
  fill(80, 210, 110); rect(20, 50, 156 * Math.max(0, player.hp / player.hpMax), 7);
  fill(255); textSize(9); textAlign(CENTER, TOP);
  text('HP ' + Math.max(0, Math.ceil(player.hp)) + ' / ' + player.hpMax, 98, 50);

  fill(240, 210, 120); textAlign(LEFT, TOP); textSize(11);
  text('Золото: ' + player.gold + '   Зелья: ' + player.potions, 20, 62);

  fill(10, 12, 20, 190); rect(10, 86, 176, 46, 6);
  fill(200, 214, 240); textSize(10);
  text('ПРОБЕЛ / ЛКМ — атака', 20, 92);
  text('Q — квесты   K — навыки', 20, 106);
  text('Очки навыков: ' + skillPoints, 20, 120);

  let ty = 146;
  for (const t of ui.toast) {
    const a = t.t < 0.2 ? t.t / 0.2 : (t.t > t.life - 0.6 ? (t.life - t.t) / 0.6 : 1);
    const c = color(t.color);
    noStroke();
    fill(10, 12, 18, 190 * a); rect(10, ty, 300, 20, 4);
    fill(red(c), green(c), blue(c), 255 * a); textSize(11);
    text(t.text, 18, ty + 5);
    ty += 24;
  }

  if (ui.showQuests) drawQuestPanel();
  if (ui.showSkills) drawSkillPanel();
  if (ui.dialog) drawDialog();
  pop();
}

function drawQuestPanel() {
  const x = 320, y = 20, w = 430, h = 30 + quests.length * 42;
  fill(12, 14, 22, 225); noStroke(); rect(x, y, w, h, 6);
  stroke(120, 160, 210); noFill(); rect(x, y, w, h, 6); noStroke();
  fill(255); textSize(13); textAlign(LEFT, TOP);
  text('Журнал квестов   (Q — закрыть)', x + 14, y + 10);
  let yy = y + 32;
  for (const q of quests) {
    fill(q.done ? color(140, 220, 140) : color(230, 230, 240));
    textSize(11);
    text((q.done ? '✔ ' : '• ') + q.title, x + 14, yy);
    fill(170, 186, 210); textSize(10);
    text(q.desc, x + 24, yy + 14);
    if (!q.done) { fill(120, 200, 255); text('Прогресс: ' + q.progress + '/' + q.goal, x + w - 120, yy + 14); }
    yy += 42;
  }
}

function drawSkillPanel() {
  const x = 320, y = 20, w = 430, h = 40 + skills.length * 46;
  fill(12, 14, 22, 228); noStroke(); rect(x, y, w, h, 6);
  stroke(150, 130, 220); noFill(); rect(x, y, w, h, 6); noStroke();
  fill(255); textSize(13); textAlign(LEFT, TOP);
  text('Дерево навыков   (K — закрыть)   Очки: ' + skillPoints, x + 14, y + 10);
  let yy = y + 34;
  skills.forEach((s, i) => {
    const ok = canLearn(s);
    fill(s.learned ? color(130, 230, 130) : (ok ? color(240, 240, 250) : color(130, 134, 148)));
    textSize(11);
    text('[' + (i + 1) + '] ' + s.name + (s.learned ? '  ✔' : (s.req.length && !s.req.every(r => hasSkill(r)) ? '  🔒 требует ' + s.req.join(', ') : '')), x + 14, yy);
    fill(170, 186, 210); textSize(10);
    text(s.desc, x + 30, yy + 14);
    yy += 46;
  });
  fill(150, 170, 200); textSize(10);
  text('Нажми 1–4, чтобы изучить доступный навык.', x + 14, y + h - 18);
}

function drawDialog() {
  const w = 520, h = 74, x = (width - w) / 2, y = height - h - 34;
  fill(10, 12, 20, 235); noStroke(); rect(x, y, w, h, 6);
  stroke(220, 200, 130); noFill(); rect(x, y, w, h, 6); noStroke();
  fill(255, 226, 140); textSize(12); textAlign(LEFT, TOP);
  text(ui.dialog.name, x + 16, y + 10);
  fill(238, 240, 248); textSize(12);
  text(ui.dialog.line, x + 16, y + 32);
  fill(160, 176, 200); textSize(10);
  text('E / Q — закрыть', x + w - 100, y + h - 18);
}

function updateQuests(dt) {
  const q = quests.find(q => q.id === 'q_explore');
  if (q && !q.done && player.y < 9) {
    q.progress = 1;
    q.done = true;
    player.xp += q.rewardXp; player.gold += q.rewardGold;
    toast('Квест выполнен: ' + q.title + ' (+' + q.rewardXp + ' XP)', '#b6e3a0');
    checkLevel();
  }
}

function windowResized() { /* фиксированный вьюпорт */ }
</script>
